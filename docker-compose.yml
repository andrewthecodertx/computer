name: computer
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: computer
      POSTGRES_USER: computer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-computer}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U computer -d computer]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-computer}
    volumes:
      - ./db/upgrade.sql:/upgrade.sql:ro
    command: [psql, -h, db, -U, computer, -d, computer, -v, ON_ERROR_STOP=1, -f, /upgrade.sql]
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgres://computer:${POSTGRES_PASSWORD:-computer}@db:5432/computer?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, /computer, --healthcheck]
      interval: 3s
      timeout: 4s
      retries: 20
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      API_BASE_URL: http://app:8080
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]

  tests:
    profiles: [test]
    image: golang:1.23-alpine
    depends_on:
      db: {condition: service_healthy}
    working_dir: /src
    volumes: [".:/src:ro"]
    tmpfs: ["/tmp:exec"]
    environment:
      TEST_DATABASE_URL: postgres://computer:${POSTGRES_PASSWORD:-computer}@db:5432/computer?sslmode=disable
      GOCACHE: /tmp/go-cache
      GOMODCACHE: /tmp/go-mod
    command: [go, test, -count=1, -v, ./internal/...]
    networks: [backend]

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-computer_pgdata}
    external: ${POSTGRES_VOLUME_EXTERNAL:-false}
networks:
  backend:
    driver: bridge
