version: "3.9"

# computer — Go backend, sandboxed with its database.
#
# This file runs the APP container. The database (`linkos-pg`) is managed
# separately by the Makefile (`make db-up`), which starts it on a Docker
# network named `computer`. All containers end up on that network, so the app
# reaches the DB at `db:5432` and the web app at `web:3000` via Docker DNS,
# isolated from the host's other containers.
#
#   make docker        # build + start the app (db must already be up)
#   make docker-down   # stop the app
#
# For a fully self-contained setup (db + app + web from scratch), see
# docker-compose.full.yml.

services:
  app:
    build: .
    container_name: go-computer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://computer:computer@db:5432/computer?sslmode=disable"
      NEXTAUTH_SECRET: "change-me-in-production"
      AUTH_SECRET: "change-me-in-production"
      NEXTAUTH_URL: "http://localhost:8080"
    networks:
      - computer

  web:
    build: ./web
    container_name: computer-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: "http://go-computer:8080"
      DATABASE_URL: "postgres://computer:computer@db:5432/computer?sslmode=disable"
      NEXTAUTH_SECRET: "change-me-in-production"
      AUTH_SECRET: "change-me-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
    networks:
      - computer

networks:
  computer:
    external: true
    name: computer